{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2> My Profile </h2 >
        <p class='text-muted'>
            View your profile information.
        </p >
    </div>
    <a href="{{ url_for('staff.dashboard') }}"
       class = "btn btn-secondary">
        Dashboard
    </a>
</div >
<div class='card shadow'>
    <div class="card-header bg-primary text-white" >
        Staff Information
    </div>
    <div class="card-body">
        <table class="table">
            <tr >
                <th > Staff ID </th>
                <td>{{ staff.staff_id }}</td>
            </tr>
            <tr>
                <th> Name </th>
                <td>{{ staff.name }}</td >
            </tr>
            <tr>
                <th> Email </th>
                <td>{{ staff.email }}</td >
            </tr>
            <tr>
                <th > Phone</th>
                <td>{{ staff.phone }}</td>
            </tr>
            <tr>
                <th> Status </th>
                <td>{{ staff.status }}</td >
            </tr>
        </table >
        <a href="{{ url_for('staff.edit_profile') }}" class="btn btn-warning">
            Edit Profile
        </a>
    </div >
</div>
{% endblock %}
