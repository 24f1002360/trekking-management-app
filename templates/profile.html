{% extends "base.html" %}
{% block content %}
<div class = "d-flex justify-content-between align-items-center mb-4" >
    <div >
        <h2>My Profile</h2>
        <p class="text-muted">
            View your personal details.
        </p>
    </div>
    <a href="{{ url_for('user.dashboard') }}"  class="btn btn-secondary">
        Dashboard
    </a>
</div >
<div class="card shadow">
    <div class="card-header bg-primary text-white" >
         <h5 class="mb-0">
            Trekker Information
        </h5 >
    </div>
    <div class="card-body">
        <table class="table">
            <tr>
                <th > Trekker ID</th>
                <td>{{ trekker.trekker_id }}</td>
            </tr>
            <tr>
                <th> Name</th >
                <td>{{ trekker.name }}</td >
            </tr>
            <tr >
                <th> Email</th>
                <td>{{ trekker.email }}</td>
            </tr>
             <tr>
                <th > Phone</th>
                <td>{{ trekker.phone }}</td>
            </tr>
        </table>
        <a href=" {{ url_for('user.edit_profile' ) }}" class="btn btn-warning"> Edit Profile </a>
    </div >
</div>

{% endblock %}
