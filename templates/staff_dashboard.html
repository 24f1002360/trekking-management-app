{% extends 'base.html' %}
{% block content %}
<div class='d-flex justify-content-between align-items-center mb-4'>
    <div>
        <h2> Staff Dashboard </h2>
        <p class='text=muted'> Welcome {{ staff.name }} </p>
    </div>
    <a href='{{ url_for('auth.logout')}}' class='btn btn-danger'> Logout </a>
</div>
<div class='row g-4'>
    <div class='col-md-4'>
        <div class='card shadow border=primary'>
            <div class='card-body text-center'>
                <h5 > Total Assigned Treks </h5>
                <h1 >{{ total_assigned}} </h1>
            </div>
        </div>
    </div>
    <div class='col-md-4'>
        <div class='card shadow border-success'>
            <div class='card-body text-center'>
                <h5> Upcoming Treks</h5>
                <h1> {{ upcoming}}</h1>
            </div>
        </div>
    </div>
    <div class='col-md-4'>
        <div class='card shadow border-warning'>
            <div class='card-body text-center'>
                <h5> Completed Treks</h5>
                <h1> {{ completed}} </h1>
            </div>
        </div>
    </div>
</div>
<hr class='my-5'>
<h4 > Quick Actions </h4>
<div class='d-felx gap-3 mt-3'>
    <a href='{{ url_for('staff.assigned_treks')}}' class='btn btn-primary'>
        View Assigned Treks 
    </a>
</div>             

{% endblock %}
