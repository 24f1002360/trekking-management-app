{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Edit Trek</h2>
    <a href="{{ url_for('admin.manage_treks') }}"
       class="btn btn-secondary">
        Back
    </a>
</div>
<div class="card shadow">
<div class="card-body">
<form method="POST"> 
    <div class="row"> 
        <div class="col-md-6 mb-3"> 
            <label class="form-label"> Trek Name</label>
            <input class="form-control" name="name" value="{{ trek.name }}" required>
        </div>

        <div class= "col-md-6 mb-3">
            <label class ="form-label">Location </label>
            <input class="form-control" name="location" value="{{ trek.location }}" required>
        </div>
        <div class=' col-md-6 mb-3' >
            <label class="form-label">Difficulty</label>
            <select class="form-select" name="difficulty">
                <option value="Easy"
                {% if trek.difficulty=="Easy" %}selected{% endif %} > Easy
                </option>
                <option value="Moderate"
                {% if trek.difficulty=="Moderate" %}selected{% endif %}> Moderate
                </option>
                <option value="Hard"
                {% if trek.difficulty=="Hard" %}selected{% endif %}> Hard
                </option>
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class ="form-label"> Duration</label>
            <input type="number" class="form-control" name="duration" value="{{ trek.duration }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class='form-label'> Available Slots</label>
            <input type="number" class="form-control"  name="available_slots" value="{{ trek.available_slots }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Assign Staff</label>
            <select class="form-select" name="staff_id">
            {% for staff in staff_members %}
                <option value="{{ staff.staff_id }}"
                {% if trek.staff_id==staff.staff_id %}selected{% endif %}> {{ staff.name }}
                </option>
            {% endfor %}
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label"> Start Date</label>
            <input type='date' class="form-control" name= "start_date" value= "{{ trek.start_date }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control" name="end_date" value="{{ trek.end_date }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" name="status">
                <option value="open"
                {% if trek.status=="open" %}selected{% endif %}> open </option>
                <option value="closed"
                {% if trek.status=="closed" %}selected{% endif %}> closed</option>
                <option value="completed"
                {% if trek.status=="completed" %}selected{% endif %}> completed </option>
            </select>
        </div>
    </div>
<button class="btn btn-warning">Update Trek </button>
</form>
</div>
</div>

{% endblock %}
